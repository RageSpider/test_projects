<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC Biology Question Bank</title>
    
    <link href="https://fonts.maateen.me/bangla/font.css" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        bangla: ['Bangla', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Bangla', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        .math-tex { font-family: 'Courier New', monospace; font-size: 1.1em; }
        .stem-image img { max-width: 100%; height: auto; border-radius: 0.5rem; margin-top: 0.5rem; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .stat-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            opacity: 0.15;
            z-index: 0;
            border-radius: inherit;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .accordion-content {
            transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 15000px;
            opacity: 1;
        }
    </style>
</head>

        const questionToChapterMap = {

            "Question 6": "zoo9", "Question 7": "bot9", "Question 8": "zoo12", "Question 9": "bot3", "Question 10": "zoo2",

            "Question 61": "bot1", "Question 62": "zoo4", "Question 63": "zoo5", "Question 64": "bot4", "Question 65": "zoo6",

            "Question 81": "zoo1", "Question 82": "bot10", "Question 83": "zoo1", "Question 84": "bot5", "Question 85": "zoo11",
            "Question 86": "zoo11", "Question 87": "bot5", "Question 88": "zoo8", "Question 89": "bot1", "Question 90": "zoo1",
            "Question 91": "bot7", "Question 92": "bot11", "Question 93": "zoo7", "Question 94": "bot4", "Question 95": "zoo5",
            "Question 96": "bot5", "Question 97": "zoo1", "Question 98": "zoo1", "Question 99": "zoo4", "Question 100": "bot8"
        };

        // --- Utilities ---
        function toBanglaNum(str) {
            const banglaDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return str.toString().replace(/\d/g, d => banglaDigits[d]);
        }
        function cleanText(text) {
            return text ? text.replace(/<p>/g, '').replace(/<\/p>/g, '').trim() : '';
        }

        // --- Init & Fetch ---
        async function fetchQuestions() {
            try {
                const urls = ['1-25.json', '26-50.json', '51-75.json', '76-100.json'];
                const results = await Promise.all(urls.map(u => fetch(u).then(r => r.json()).catch(()=>[])));
                
                results.forEach(d => { if(Array.isArray(d)) allQuestions = allQuestions.concat(d); });
                
                if (allQuestions.length === 0) throw new Error("No data");

                populateChapterFilter();
                setupEventListeners();
                updateApp();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('renderContainer').classList.remove('hidden');

            } catch (err) {
                document.getElementById('loading').innerHTML = `<p class="text-rose-500 font-bold">ডাটা লোড হয়নি! লোকাল সার্ভার ব্যবহার করুন।</p>`;
            }
        }

        function populateChapterFilter() {
            const select = document.getElementById('chapterFilter');
            const uniqueIds = [...new Set(allQuestions.map(q => questionToChapterMap[q.question_number]))];
            
            uniqueIds.sort((a,b) => (chaptersInfo[a]?.index||999) - (chaptersInfo[b]?.index||999))
                     .forEach(id => {
                        if(!id) return;
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.textContent = chaptersInfo[id].title;
                        select.appendChild(opt);
                     });
        }

        function setupEventListeners() {
            document.getElementById('chapterFilter').addEventListener('change', e => { currentFilters.chapter = e.target.value; updateApp(); });
            document.getElementById('statusFilter').addEventListener('change', e => { currentFilters.status = e.target.value; updateApp(); });
            document.getElementById('searchFilter').addEventListener('input', e => { currentFilters.search = e.target.value.toLowerCase(); updateApp(); });
        }

        function resetFilters() {
            document.getElementById('chapterFilter').value = 'all';
            document.getElementById('statusFilter').value = 'all';
            document.getElementById('searchFilter').value = '';
            currentFilters = { chapter: 'all', status: 'all', search: '' };
            updateApp();
        }

        function setViewMode(mode) {
            viewMode = mode;
            const btnSeq = document.getElementById('btnSeq');
            const btnGrp = document.getElementById('btnGrp');
            
            if(mode === 'sequential') {
                btnSeq.className = "flex-1 md:flex-none px-4 py-1.5 rounded-md text-sm font-bold bg-white text-brand-600 shadow-sm transition-all";
                btnGrp.className = "flex-1 md:flex-none px-4 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-slate-700 transition-all";
            } else {
                btnGrp.className = "flex-1 md:flex-none px-4 py-1.5 rounded-md text-sm font-bold bg-white text-brand-600 shadow-sm transition-all";
                btnSeq.className = "flex-1 md:flex-none px-4 py-1.5 rounded-md text-sm font-bold text-slate-500 hover:text-slate-700 transition-all";
            }
            updateApp();
        }

        // --- Core Render Logic ---
        function updateApp() {
            // 1. Apply Filters
            let filtered = allQuestions.filter(q => {
                const chapterId = questionToChapterMap[q.question_number] || "unknown";
                const matchChapter = currentFilters.chapter === 'all' || chapterId === currentFilters.chapter;
                const matchStatus = currentFilters.status === 'all' || q.category === currentFilters.status;
                const searchStr = (q.question_text + q.stem).toLowerCase();
                const matchSearch = searchStr.includes(currentFilters.search);
                return matchChapter && matchStatus && matchSearch;
            });

            // 2. Update Dashboard
            const correctCount = filtered.filter(q => q.category === 'Correct').length;
            const incorrectCount = filtered.filter(q => q.category === 'Incorrect').length;
            document.getElementById('dashTotal').textContent = toBanglaNum(filtered.length);
            document.getElementById('dashCorrect').textContent = toBanglaNum(correctCount);
            document.getElementById('dashIncorrect').textContent = toBanglaNum(incorrectCount);

            const container = document.getElementById('renderContainer');
            const emptyState = document.getElementById('emptyState');

            if(filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            // 3. Render View
            if (viewMode === 'sequential') {
                // Ensure natural numerical sorting if Sequential
                filtered.sort((a,b) => parseInt(a.question_number.replace(/\D/g,'')) - parseInt(b.question_number.replace(/\D/g,'')));
                container.innerHTML = `<div class="space-y-6">${filtered.map((q, i) => generateCardHTML(q, i)).join('')}</div>`;
            } else {
                container.innerHTML = `<div class="space-y-6">${generateGroupedHTML(filtered)}</div>`;
            }

            if(window.MathJax) MathJax.typesetPromise();
        }

        // --- HTML Generators ---
        function generateCardHTML(item, delayIndex = 0, hideChapterTag = false) {
            const qNumBangla = item.question_number.replace('Question ', '');
            const chapterId = questionToChapterMap[item.question_number] || "unknown";
            const chapterName = chaptersInfo[chapterId].title;
            const isCorrectQ = item.category === 'Correct';

            const stemHtml = item.stem && item.stem.trim() !== '' 
                ? `<div class="stem-image bg-slate-50/50 border border-slate-200 p-4 rounded-xl mb-4 text-[15px] text-slate-700">${item.stem}</div>` : '';

            const optionsHtml = item.options.map(opt => {
                const isCorrect = opt.letter === item.correct_answer;
                const isStudent = opt.letter === item.student_answer;
                const statStr = item.statistics && item.statistics[opt.letter] ? item.statistics[opt.letter] : "0%";
                
                let boxClass = "border-slate-200 hover:bg-slate-50";
                let textClass = "text-slate-700";
                let fillClass = "bg-slate-200";
                let icon = `<div class="w-7 h-7 rounded bg-white border border-slate-300 flex items-center justify-center mr-3 text-sm font-bold text-slate-500 z-10">${opt.letter}</div>`;

                if (isCorrect) {
                    boxClass = "border-emerald-300 bg-emerald-50/30";
                    textClass = "text-emerald-900 font-bold";
                    fillClass = "bg-emerald-400 opacity-20";
                    icon = `<div class="w-7 h-7 rounded bg-emerald-500 flex items-center justify-center mr-3 z-10 text-white shadow-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`;
                } else if (isStudent) {
                    boxClass = "border-rose-300 bg-rose-50/30";
                    textClass = "text-rose-900";
                    fillClass = "bg-rose-400 opacity-20";
                    icon = `<div class="w-7 h-7 rounded bg-rose-500 flex items-center justify-center mr-3 z-10 text-white shadow-sm"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>`;
                }

                return `
                    <div class="relative p-3 rounded-xl border ${boxClass} transition-all duration-200 mb-2 overflow-hidden flex items-center">
                        <div class="stat-fill ${fillClass}" style="width: ${parseFloat(statStr)||0}%"></div>
                        ${icon}
                        <div class="flex-1 text-[15.5px] ${textClass} leading-snug z-10">${cleanText(opt.text)}</div>
                        <div class="ml-4 text-sm font-bold ${isCorrect ? 'text-emerald-600' : 'text-slate-400'} z-10">${toBanglaNum(statStr)}</div>
                    </div>`;
            }).join('');

            const solutionHtml = item.solution && item.solution.trim() !== '' ? `
                <div class="mt-4">
                    <button onclick="toggleSolution('sol-${item.question_number}')" class="flex items-center gap-2 text-sm font-bold text-brand-600 hover:text-brand-700 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-lg transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        ব্যাখ্যা দেখুন
                    </button>
                    <div id="sol-${item.question_number}" class="hidden mt-3 bg-white border border-brand-100 rounded-xl p-5 shadow-sm">
                        <p class="text-[15px] text-slate-700 leading-relaxed">${item.solution}</p>
                    </div>
                </div>` : '';

            const statusBadge = isCorrectQ 
                ? `<span class="flex items-center gap-1 text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-md border border-emerald-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg> সঠিক</span>`
                : `<span class="flex items-center gap-1 text-xs font-bold text-rose-700 bg-rose-100 px-2.5 py-1 rounded-md border border-rose-200"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg> ভুল</span>`;

            const chapterTag = hideChapterTag ? '' : `<div class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full mb-3 inline-block border border-slate-200">${chapterName}</div>`;

            return `
                <div class="bg-white border ${isCorrectQ ? 'border-emerald-100 shadow-emerald-500/5' : 'border-rose-100 shadow-rose-500/5'} rounded-2xl shadow-sm overflow-hidden animate-fade-in-up" style="animation-delay: ${Math.min(delayIndex * 0.05, 0.5)}s; opacity: 0;">
                    <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-extrabold text-slate-700 bg-white px-3 py-1 rounded-md border border-slate-200 shadow-sm">প্রশ্ন ${toBanglaNum(qNumBangla)}</span>
                            ${statusBadge}
                        </div>
                    </div>
                    <div class="p-5 md:p-6">
                        ${chapterTag}
                        ${stemHtml}
                        <div class="text-[17px] font-semibold text-slate-800 mb-5 leading-relaxed">
                            ${item.question_text}
                        </div>
                        <div class="flex flex-col gap-1">
                            ${optionsHtml}
                        </div>
                        ${solutionHtml}
                    </div>
                </div>`;
        }

        function generateGroupedHTML(filteredData) {
            const grouped = {};
            filteredData.forEach(q => {
                const cId = questionToChapterMap[q.question_number] || "unknown";
                if (!grouped[cId]) grouped[cId] = [];
                grouped[cId].push(q);
            });

            const sortedChapterIds = Object.keys(grouped).sort((a,b) => (chaptersInfo[a]?.index||999) - (chaptersInfo[b]?.index||999));

            return sortedChapterIds.map((cId, cIndex) => {
                const chapterData = chaptersInfo[cId];
                const questions = grouped[cId];
                
                // Hide chapter tag inside grouped mode since header already says it
                const questionsHtml = questions.map((q, i) => generateCardHTML(q, i, true)).join('<hr class="border-slate-100 my-4">');

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden animate-fade-in-up" style="animation-delay: ${Math.min(cIndex * 0.08, 0.5)}s; opacity: 0;">
                        <button onclick="toggleAccordion('chapter-${cIndex}')" class="w-full px-6 py-5 flex justify-between items-center bg-white hover:bg-slate-50 transition-colors focus:outline-none">
                            <div class="flex items-center gap-4 text-left">
                                <div class="bg-brand-50 border border-brand-200 text-brand-600 w-10 h-10 rounded-full flex items-center justify-center font-bold shadow-sm">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                </div>
                                <div>
                                    <h2 class="text-lg font-extrabold text-slate-800">${chapterData.title}</h2>
                                    <p class="text-sm font-medium text-slate-500 mt-0.5">${toBanglaNum(questions.length)} টি প্রশ্ন</p>
                                </div>
                            </div>
                            <div id="icon-chapter-${cIndex}" class="text-slate-400 transform transition-transform duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </button>
                        <div id="chapter-${cIndex}" class="accordion-content bg-slate-50/50 border-t border-slate-100 px-2 sm:px-6 py-2">
                            ${questionsHtml}
                        </div>
                    </div>`;
            }).join('');
        }

        // --- Interactions ---
        function toggleAccordion(id) {
            const content = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        function toggleSolution(id) {
            const sol = document.getElementById(id);
            if (sol.classList.contains('hidden')) {
                sol.classList.remove('hidden');
                sol.classList.add('animate-fade-in-up');
            } else {
                sol.classList.add('hidden');
                sol.classList.remove('animate-fade-in-up');
            }
        }

        // --- Boot ---
        window.addEventListener('DOMContentLoaded', fetchQuestions);
    </script>
</body>
</html>
