<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS RESTRICTED // LOADING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050505;
            --accent: #333;
            --glitch: #ff3333;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            cursor: progress;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .glitch-wrapper {
            position: relative;
        }
        
        .glitch-text {
            font-family: 'VT323', monospace;
            font-size: 8rem;
            line-height: 0.8;
            position: relative;
            animation: glitch-skew 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(3px, 9999px, 86px, 0); }
            5% { clip: rect(89px, 9999px, 12px, 0); }
            10% { clip: rect(2px, 9999px, 45px, 0); }
            15% { clip: rect(23px, 9999px, 78px, 0); }
            20% { clip: rect(67px, 9999px, 2px, 0); }
            100% { clip: rect(45px, 9999px, 92px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(12px, 9999px, 43px, 0); }
            5% { clip: rect(65px, 9999px, 98px, 0); }
            10% { clip: rect(82px, 9999px, 11px, 0); }
            15% { clip: rect(2px, 9999px, 19px, 0); }
            20% { clip: rect(45px, 9999px, 23px, 0); }
            100% { clip: rect(78px, 9999px, 65px, 0); }
        }

        .loading-bar {
            width: 300px;
            height: 2px;
            background: #222;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
        }
        .loading-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background: #fff;
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div class="scanlines"></div>

    <div class="z-20 text-center flex flex-col items-center p-8 border border-white/10 bg-black/50 backdrop-blur-sm max-w-2xl w-full">
        
        <div class="mb-4 text-xs font-mono text-gray-500 tracking-[0.5em] uppercase">
            System Message // Error 423
        </div>

        <div class="glitch-wrapper mb-8">
            <h1 class="glitch-text text-white" data-text="LOCKED">LOCKED</h1>
        </div>

        <p class="text-gray-400 font-light max-w-md mx-auto leading-relaxed">
            The narrative fragment you are attempting to access is currently being compiled by the host. 
            <br><br>
            <span class="text-white font-bold">STATUS:</span> <span class="text-yellow-500 font-mono">PENDING_CREATION</span>
        </p>

        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>

        <div class="mt-8 font-mono text-xs text-gray-600">
            SYNCING DATABASE <span class="blink">_</span>
        </div>

        <div class="mt-12 pt-8 border-t border-white/10 w-full">
            <a href="../index.html" class="group flex items-center justify-center gap-2 text-sm text-gray-500 hover:text-white transition-colors uppercase tracking-widest">
                <i class="fas fa-arrow-left text-xs transform group-hover:-translate-x-1 transition-transform"></i>
                Return to Vault
            </a>
        </div>
    </div>

    <!-- Decorative background elements -->
    <div class="fixed top-10 left-10 text-gray-800 font-mono text-xs hidden md:block">
        COORD: NULL<br>
        SECTOR: UNKNOWN
    </div>
    <div class="fixed bottom-10 right-10 text-gray-800 font-mono text-xs hidden md:block text-right">
        MEMORY LEAK DETECTED<br>
        PLEASE HOLD...
    </div>

</body>
</html>
