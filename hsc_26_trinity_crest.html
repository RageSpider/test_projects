<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSC 26 | THE TRINITY CREST</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Italiana&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- THREE.JS + POST PROCESSING -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
        }
      }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#020305',
                        gold: '#d4af37',
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        clash: ['Clash Display', 'sans-serif'],
                        italiana: ['Italiana', 'serif'],
                    },
                    backgroundImage: {
                        'radial-gradient': 'radial-gradient(circle at center, var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #020305;
            color: #d4af37;
            overflow: hidden;
            font-family: 'Clash Display', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        /* Cinematic Overlays */
        .overlay-vignette {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, #000 120%);
        }
        
        .overlay-grain {
            position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Typography Overlay */
        .ui-container {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            pointer-events: none;
        }

        .hero-text {
            position: absolute;
            bottom: 10%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
        }

        .batch-year {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5em;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            padding-bottom: 0.5rem;
        }

        .main-title {
            font-family: 'Clash Display', sans-serif;
            font-weight: 700;
            font-size: 4rem;
            line-height: 0.9;
            color: #d4af37;
            text-transform: uppercase;
            /* Metal Text Effect */
            background: linear-gradient(to bottom, #fceeb5 0%, #d4af37 50%, #9e7f1b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.2));
        }

        @media (min-width: 768px) {
            .main-title { font-size: 7rem; }
        }

        /* Loader */
        #loader {
            position: fixed; inset: 0; z-index: 99;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader-line {
            width: 150px; height: 1px; background: #333; margin-top: 20px;
            position: relative; overflow: hidden;
        }
        .loader-prog {
            position: absolute; inset: 0; background: #d4af37;
            transform: translateX(-100%);
            animation: loadAnim 2s ease-in-out infinite;
        }
        @keyframes loadAnim { 0% { transform: translateX(-100%); } 50% { transform: translateX(0); } 100% { transform: translateX(100%); } }

    </style>
</head>
<body>

    <!-- LOADER -->
    <div id="loader">
        <div class="font-cinzel text-xs tracking-[0.4em] text-white/50">CONVERGING TIMELINES</div>
        <div class="loader-line"><div class="loader-prog"></div></div>
    </div>

    <!-- CANVAS -->
    <div id="canvas-container"></div>
    
    <!-- OVERLAYS -->
    <div class="overlay-vignette"></div>
    <div class="overlay-grain"></div>

    <!-- UI -->
    <div class="ui-container">
        <!-- The 3D Object sits in the middle -->
        
        <div class="hero-text reveal-ui">
            <span class="batch-year">EST. 2024 • DHAKA</span>
            <h1 class="main-title">HSC 26</h1>
            <div class="flex justify-center gap-6 mt-6 opacity-60">
                <div class="flex items-center gap-2">
                    <div class="w-1 h-1 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6]"></div>
                    <span class="text-[9px] uppercase tracking-widest font-cinzel text-blue-200">Origin</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-1 h-1 rounded-full bg-green-500 shadow-[0_0_10px_#4ade80]"></div>
                    <span class="text-[9px] uppercase tracking-widest font-cinzel text-green-200">Growth</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-1 h-1 rounded-full bg-yellow-500 shadow-[0_0_10px_#d4af37]"></div>
                    <span class="text-[9px] uppercase tracking-widest font-cinzel text-yellow-200">Legacy</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Rich, dark foggy background
        scene.fog = new THREE.FogExp2(0x020305, 0.02);
        
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); // Antialias false for performance with post-proc
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        // --- POST PROCESSING (THE GLOW) ---
        const renderScene = new RenderPass(scene, camera);
        
        // Bloom Parameters: Strength, Radius, Threshold
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2; // Only glow bright things
        bloomPass.strength = 1.2;  // Intensity
        bloomPass.radius = 0.5;    // Spread

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- THE ARTIFACT GROUP ---
        const artifact = new THREE.Group();
        scene.add(artifact);

        // --- 1. CORE: THE DEEP (SECTION A) ---
        // A dark, volatile sphere with blue fire shader
        const coreGeo = new THREE.IcosahedronGeometry(2, 4); // High detail sphere
        
        const coreMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColorDeep: { value: new THREE.Color('#000000') },
                uColorFire: { value: new THREE.Color('#1e40af') }, // Dark Blue
                uColorBright: { value: new THREE.Color('#60a5fa') } // Light Blue
            },
            vertexShader: `
                uniform float uTime;
                varying vec2 vUv;
                varying float vNoise;
                varying vec3 vNormal;

                // Simplex Noise Function (Simplified)
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) {
                    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy) );
                    vec3 x0 = v - i + dot(i, C.xxx) ;
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min( g.xyz, l.zxy );
                    vec3 i2 = max( g.xyz, l.zxy );
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i); 
                    vec4 p = permute( permute( permute( 
                                i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                    float n_ = 0.142857142857;
                    vec3  ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_ );
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4( x.xy, y.xy );
                    vec4 b1 = vec4( x.zw, y.zw );
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                    vec3 p0 = vec3(a0.xy,h.x);
                    vec3 p1 = vec3(a0.zw,h.y);
                    vec3 p2 = vec3(a1.xy,h.z);
                    vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
                }

                void main() {
                    vUv = uv;
                    vNormal = normal;
                    // Displace surface with noise over time
                    float noiseVal = snoise(position * 1.5 + uTime * 0.5);
                    vNoise = noiseVal;
                    vec3 newPos = position + normal * noiseVal * 0.3;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColorDeep;
                uniform vec3 uColorFire;
                uniform vec3 uColorBright;
                varying float vNoise;
                varying vec3 vNormal;

                void main() {
                    // Fresnel rim effect
                    vec3 viewDir = normalize(cameraPosition - vNormal); // Approximation
                    float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 3.0);
                    
                    // Mix colors based on noise and depth
                    vec3 color = mix(uColorDeep, uColorFire, vNoise + 0.5);
                    color = mix(color, uColorBright, fresnel * (vNoise + 0.5));
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        artifact.add(core);


        // --- 2. SURROUNDING: THE GARDEN (SECTION H) ---
        // Floating organic particles/spores wrapping the core
        const particleCount = 600;
        const partGeo = new THREE.BufferGeometry();
        const partPos = [];
        const partSizes = [];
        const partSpeeds = [];

        for(let i=0; i<particleCount; i++) {
            // Spiral distribution
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 2.8 + Math.random() * 1.5; // Just outside core
            
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            
            partPos.push(x, y, z);
            partSizes.push(Math.random());
            partSpeeds.push(0.5 + Math.random() * 0.5);
        }

        partGeo.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
        partGeo.setAttribute('size', new THREE.Float32BufferAttribute(partSizes, 1));
        partGeo.setAttribute('speed', new THREE.Float32BufferAttribute(partSpeeds, 1));

        const partMat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color('#4ade80') } // Green
            },
            vertexShader: `
                uniform float uTime;
                attribute float size;
                attribute float speed;
                varying float vAlpha;
                
                void main() {
                    vec3 pos = position;
                    // Orbit Animation
                    float angle = uTime * speed * 0.5;
                    float s = sin(angle);
                    float c = cos(angle);
                    // Rotation around Y
                    float nx = pos.x * c - pos.z * s;
                    float nz = pos.x * s + pos.z * c;
                    pos.x = nx;
                    pos.z = nz;
                    
                    // Breathe
                    pos *= 1.0 + sin(uTime + pos.y) * 0.05;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    gl_PointSize = size * (100.0 / -mvPosition.z);
                    vAlpha = 0.8;
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;
                void main() {
                    float dist = length(gl_PointCoord - 0.5);
                    if (dist > 0.5) discard;
                    gl_FragColor = vec4(uColor, vAlpha * (1.0 - dist*2.0));
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const garden = new THREE.Points(partGeo, partMat);
        artifact.add(garden);


        // --- 3. FRAME: THE ARCHIVE (SECTION B) ---
        // Geometric golden rings/Astrolabe
        
        function createRing(radius, thickness, color) {
            const geo = new THREE.TorusGeometry(radius, thickness, 16, 100);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                metalness: 1.0,
                roughness: 0.2,
                emissive: color,
                emissiveIntensity: 0.2
            });
            return new THREE.Mesh(geo, mat);
        }

        // Main Vertical Ring
        const ring1 = createRing(4.2, 0.05, 0xd4af37);
        artifact.add(ring1);

        // Angled Inner Ring
        const ring2 = createRing(3.8, 0.03, 0xffd700);
        ring2.rotation.x = Math.PI / 3;
        artifact.add(ring2);

        // Horizontal Outer Ring
        const ring3 = createRing(5.0, 0.02, 0xcbb69d); // Sepia gold
        ring3.rotation.x = Math.PI / 2;
        artifact.add(ring3);

        // Add some "Data Points" on the rings (small cubes)
        const dataGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        const dataMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        for(let i=0; i<8; i++) {
            const mesh = new THREE.Mesh(dataGeo, dataMat);
            const angle = (i / 8) * Math.PI * 2;
            mesh.position.set(Math.cos(angle)*4.2, Math.sin(angle)*4.2, 0);
            ring1.add(mesh); // Attach to ring1 so it rotates with it
        }

        // --- LIGHTING ---
        // Key Light (Warm)
        const light1 = new THREE.PointLight(0xffaa00, 2, 50);
        light1.position.set(10, 10, 10);
        scene.add(light1);
        
        // Fill Light (Cool Blue to accent core)
        const light2 = new THREE.PointLight(0x0055ff, 2, 50);
        light2.position.set(-10, -10, 5);
        scene.add(light2);

        // Back Light
        const light3 = new THREE.PointLight(0xffffff, 1, 50);
        light3.position.set(0, 10, -10);
        scene.add(light3);


        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();

        // Mouse Parallax
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.0005;
            mouseY = (event.clientY - windowHalfY) * 0.0005;
        });

        // Touch
        document.addEventListener('touchmove', (event) => {
            mouseX = (event.touches[0].clientX - windowHalfX) * 0.001;
            mouseY = (event.touches[0].clientY - windowHalfY) * 0.001;
        });

        function animate() {
            const time = clock.getElapsedTime();

            // Update Uniforms
            coreMat.uniforms.uTime.value = time;
            partMat.uniforms.uTime.value = time;

            // Rotate Rings (Mechanical feel)
            ring1.rotation.z = time * 0.1; // Slow constant
            ring2.rotation.y = time * 0.15;
            ring3.rotation.z = -time * 0.05;

            // Parallax Ease
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;

            // Apply global rotation to artifact
            artifact.rotation.y = targetX * 2; // Follow mouse
            artifact.rotation.x = targetY * 2;

            // Gentle floating bob
            artifact.position.y = Math.sin(time * 0.5) * 0.2;

            // Render with Bloom
            composer.render();
            requestAnimationFrame(animate);
        }
        animate();

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- INIT UI ---
        window.onload = () => {
            const loader = document.getElementById('loader');
            gsap.to(loader, {
                opacity: 0, 
                duration: 1, 
                onComplete: () => {
                    loader.style.display = 'none';
                    gsap.to('.reveal-ui', { opacity: 1, y: 0, duration: 1.5, ease: 'power3.out' });
                }
            });
        };

    </script>
</body>
</html>
