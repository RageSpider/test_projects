  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/DrawSVGPlugin.min.js"></script>
  
  <script>
    // Register the DrawSVGPlugin now that it's standard and freely available
    gsap.registerPlugin(DrawSVGPlugin);

    var xmlns = "http://www.w3.org/2000/svg",
      xlinkns = "http://www.w3.org/1999/xlink",
      select = function (s) {
        return document.querySelector(s);
      },
      selectAll = function (s) {
        return document.querySelectorAll(s);
      },
      ga = function (s, a) {
        return s.getAttribute(a);
      },
      // Updated to modern gsap.timeline
      mainTl = gsap.timeline({ repeat: -1 }).timeScale(2),
      mainSVG = select('.mainSVG'),
      playBubbleGroup = select('#playBubbleGroup'),
      withBubbleGroup = select('#withBubbleGroup'),
      codeBubbleGroup = select('#codeBubbleGroup'),
      marqueeRect = select('#marqueeRect'),
      rectMarqueeGroup = select('#rectMarqueeGroup'),
      crossHair = select('#crossHair'),
      cursor = select('#cursor'),
      marqueeCircle = select('#marqueeCircle'),
      marqueeCircle2 = select('#marqueeCircle2'),
      marqueeCircle3 = select('#marqueeCircle3'),
      mainMarqueeCircle = select('#mainMarqueeCircle'),
      mainMarqueeCircle2 = select('#mainMarqueeCircle2'),
      mainMarqueeCircle3 = select('#mainMarqueeCircle3'),
      popGroup = select('#popGroup'),
      playPop = popGroup.cloneNode(true),
      withPop = popGroup.cloneNode(true),
      codePop = popGroup.cloneNode(true);

    playBubbleGroup.appendChild(playPop);
    withBubbleGroup.appendChild(withPop);
    codeBubbleGroup.appendChild(codePop);

    // Updated to gsap.set
    gsap.set('svg', {
      visibility: 'visible'
    });
    gsap.set(crossHair, {
      x: 100,
      y: 100
    });

    gsap.set([playPop.querySelectorAll('line'), withPop.querySelectorAll('line'), codePop.querySelectorAll('line')], {
      drawSVG: '50% 50%'
    });

    gsap.set([playPop, withPop, codePop], {
      x: 265,
      y: 165
    });

    // Using modern gsap strings for eases
    var bubble1Tl = gsap.timeline({ paused: false });
    bubble1Tl.to([cursor, crossHair], {
      duration: 1,
      x: 400 - (crossHair.getBBox().width / 2)
    })
      .to([cursor, crossHair], {
        duration: 1.5,
        y: 300 - (crossHair.getBBox().height / 2)
      }, '-=1')
      .from(marqueeCircle, {
        duration: 1,
        attr: {
          rx: 0,
          ry: 0
        }
      })
      .to([cursor, crossHair], {
        duration: 1,
        x: (Math.cos(45 * Math.PI / 180) * 123) + 400,
        y: (Math.cos(45 * Math.PI / 180) * 123) + 300
      }, '-=1')
      .set(mainMarqueeCircle, {
        stroke: '#ededed'
      })
      .from(playBubbleGroup, {
        duration: 2,
        scaleY: 0.9,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.24)"
      })
      .from(playBubbleGroup, {
        duration: 2,
        scaleX: 1.1,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.16)"
      }, '-=2')
      .to(playBubbleGroup, {
        duration: 8,
        x: '-=200',
        ease: "sine.in"
      }, '-=2')
      .to(playBubbleGroup, {
        duration: 8,
        y: '-=150',
        ease: "none"
      }, '-=8')
      .to(playPop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '75% 100%',
        ease: "none"
      }, '-=0.8')
      .to(playPop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '100% 100%',
        ease: "power3.out"
      }, '-=0.6')
      .to(playBubbleGroup.querySelector('use'), {
        duration: 0.01,
        scale: 0.8,
        transformOrigin: '50% 50%',
        alpha: 0
      }, '-=0.8')
      .to('#playBubbleText', {
        duration: 2,
        y: 800,
        ease: "sine.in"
      }, '-=0.8')
      .to('#playBubbleText', {
        duration: 6,
        rotation: -23,
        transformOrigin: '50% 0%',
        ease: "elastic.out(1, 0.6)"
      }, '-=2');

    var bubble2Tl = gsap.timeline({ paused: false });
    bubble2Tl.to([cursor, crossHair], {
      duration: 1,
      x: 400 - (crossHair.getBBox().width / 2)
    })
      .to([cursor, crossHair], {
        duration: 1.5,
        y: 300 - (crossHair.getBBox().height / 2)
      }, '-=1')
      .from(marqueeCircle2, {
        duration: 1,
        attr: {
          rx: 0,
          ry: 0
        }
      })
      .to([cursor, crossHair], {
        duration: 1,
        x: (Math.cos(45 * Math.PI / 180) * 123) + 400,
        y: (Math.cos(45 * Math.PI / 180) * 123) + 300
      }, '-=1')
      .set(mainMarqueeCircle2, {
        stroke: '#ededed'
      })
      .from(withBubbleGroup, {
        duration: 2,
        scaleY: 0.9,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.24)"
      })
      .from(withBubbleGroup, {
        duration: 2,
        scaleX: 1.1,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.16)"
      }, '-=2')
      .to(withBubbleGroup, {
        duration: 8,
        x: '-=0',
        ease: "sine.in"
      }, '-=2')
      .to(withBubbleGroup, {
        duration: 8,
        y: '-=150',
        ease: "none"
      }, '-=8')
      .to(withPop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '75% 100%',
        ease: "none"
      }, '-=0.8')
      .to(withPop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '100% 100%',
        ease: "power3.out"
      }, '-=0.6')
      .to(withBubbleGroup.querySelector('use'), {
        duration: 0.01,
        scale: 0.8,
        transformOrigin: '50% 50%',
        alpha: 0
      }, '-=0.8')
      .to('#withBubbleText', {
        duration: 2,
        y: 800,
        ease: "sine.in"
      }, '-=0.8')
      .to('#withBubbleText', {
        duration: 6,
        rotation: 45,
        transformOrigin: '0% 0%',
        ease: "elastic.out(1, 0.6)"
      }, '-=2');

    var bubble3Tl = gsap.timeline({ paused: false });
    bubble3Tl.to([cursor, crossHair], {
      duration: 1,
      x: 400 - (crossHair.getBBox().width / 2)
    })
      .to([cursor, crossHair], {
        duration: 1.5,
        y: 300 - (crossHair.getBBox().height / 2)
      }, '-=1')
      .from(marqueeCircle3, {
        duration: 1,
        attr: {
          rx: 0,
          ry: 0
        }
      })
      .to([cursor, crossHair], {
        duration: 1,
        x: (Math.cos(45 * Math.PI / 180) * 123) + 400,
        y: (Math.cos(45 * Math.PI / 180) * 123) + 300
      }, '-=1')
      .set(mainMarqueeCircle3, {
        stroke: '#ededed'
      })
      .from(codeBubbleGroup, {
        duration: 2,
        scaleY: 0.9,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.24)"
      })
      .from(codeBubbleGroup, {
        duration: 2,
        scaleX: 1.1,
        immediateRender: false,
        transformOrigin: '50% 50%',
        ease: "elastic.out(1, 0.16)"
      }, '-=2')
      .to(codeBubbleGroup, {
        duration: 8,
        x: '+=200',
        ease: "sine.in"
      }, '-=2')
      .to(codeBubbleGroup, {
        duration: 8,
        y: '-=150',
        ease: "none"
      }, '-=8')
      .to(codePop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '75% 100%',
        ease: "none"
      }, '-=0.8')
      .to(codePop.querySelectorAll('line'), {
        duration: 0.2,
        drawSVG: '100% 100%',
        ease: "power3.out"
      }, '-=0.6')
      .to(codeBubbleGroup.querySelector('use'), {
        duration: 0.01,
        scale: 0.8,
        transformOrigin: '50% 50%',
        alpha: 0
      }, '-=0.8')
      .to('#codeBubbleText', {
        duration: 2,
        y: 800,
        ease: "sine.in"
      }, '-=0.8')
      .to('#codeBubbleText', {
        duration: 4,
        rotation: -105,
        transformOrigin: '100% 0%',
        ease: "elastic.out(0.3, 0.6)"
      }, '-=2')
      .to(crossHair, {
        duration: 4,
        x: 100,
        y: 100
      }, '-=10');

    mainTl.add(bubble1Tl, 0);
    mainTl.add(bubble2Tl, 3);
    mainTl.add(bubble3Tl, 6);
  </script>
</body>
</html>
