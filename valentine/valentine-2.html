<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access Request</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-green: #008F11;
            --bg-black: #0D0208;
            --term-bg: rgba(10, 10, 10, 0.95);
        }

        body {
            background-color: var(--bg-black);
            color: var(--neon-green);
            font-family: 'VT323', monospace;
            margin: 0;
            height: 100vh;
            /* Dynamic viewport height for mobile browsers */
            height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 20;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.97; }
            5% { opacity: 0.95; }
            100% { opacity: 0.98; }
        }

        /* Matrix Canvas Background */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.2;
        }

        /* Terminal Window */
        .terminal-window {
            position: relative;
            z-index: 30;
            width: 95%;
            max-width: 800px;
            /* Maximize space but keep borders */
            height: 90vh; 
            max-height: 700px;
            background: var(--term-bg);
            border: 2px solid var(--dark-green);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15), inset 0 0 40px rgba(0,0,0,0.8);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: turnOn 0.4s ease-out forwards;
            transform-origin: center;
        }

        @keyframes turnOn {
            0% { transform: scaleY(0.005) scaleX(0); opacity: 0; }
            50% { transform: scaleY(0.005) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }

        .terminal-header {
            background: var(--dark-green);
            color: black;
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 2px solid #005f0b;
            flex-shrink: 0;
        }

        .terminal-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden; /* Prevent horizontal scroll bugs */
            font-size: 1.25rem;
            line-height: 1.4;
            scrollbar-width: thin;
            scrollbar-color: var(--dark-green) transparent;
        }

        /* Custom Scrollbar */
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb { background-color: var(--dark-green); border-radius: 4px; }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: var(--neon-green);
            animation: blink 1s infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn-term {
            background: rgba(0, 255, 65, 0.1);
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px 32px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 140px;
            text-align: center;
            /* Prevent text selection causing glitches */
            user-select: none; 
        }

        .btn-term:hover {
            background: var(--neon-green);
            color: black;
            box-shadow: 0 0 25px var(--neon-green);
        }

        /* Glitch Button Styles */
        .btn-glitch {
            border-color: #ff003c;
            color: #ff003c;
            background: rgba(255, 0, 60, 0.05);
        }
        
        .btn-glitch:hover, .btn-glitch:active {
            animation: glitch-anim 0.2s infinite;
            background: #ff003c;
            color: black;
            box-shadow: 0 0 20px #ff003c;
        }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* IMAGE STYLING */
        .heart-img {
            width: 150px;
            height: auto;
            margin: 20px auto;
            display: block;
            image-rendering: pixelated; /* Essential for that retro look */
            filter: drop-shadow(0 0 10px #ff0055);
            animation: pulse-heart 2s infinite ease-in-out;
        }

        @keyframes pulse-heart {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff0055); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 20px #ff0055); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff0055); }
        }

        /* Responsive Breakpoints */
        @media (min-width: 640px) {
            .heart-img { width: 200px; }
            .terminal-body { font-size: 1.5rem; }
        }

        @media (max-width: 480px) {
            .terminal-window { width: 100%; height: 100dvh; border: none; border-radius: 0; }
            .terminal-body { padding: 15px; font-size: 1.1rem; }
            .btn-term { padding: 10px 20px; font-size: 1rem; width: 100%; }
            .btn-container { flex-direction: column; gap: 15px; width: 100%; }
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div class="terminal-window">
        <div class="terminal-header">
            <span>root@heart-server:~</span>
            <div class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-red-600"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
        </div>
        
        <div class="terminal-body" id="console">
            <!-- Content injected here -->
        </div>
    </div>

    <script>
        // --- MATRIX BACKGROUND ---
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const chars = "01";
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];

        function initDrops() {
            columns = Math.ceil(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -50; 
            }
        }
        initDrops();
        window.addEventListener('resize', initDrops);

        function drawMatrix() {
            ctx.fillStyle = "rgba(13, 2, 8, 0.1)"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#008F11"; 
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillStyle = Math.random() > 0.95 ? "#00ff41" : "#008F11";
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // --- TERMINAL LOGIC ---
        const consoleDiv = document.getElementById('console');
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // Simplified typing logic to avoid HTML breaking
        async function typeLine(text, speed = 25, className = '') {
            const p = document.createElement('div');
            if(className) p.className = className;
            consoleDiv.appendChild(p);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;

            let buffer = "";
            let isTag = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text.charAt(i);
                
                if(char === '<') isTag = true;
                if(char === '>') {
                    isTag = false;
                    buffer += char;
                    p.innerHTML = buffer;
                    continue;
                }
                
                buffer += char;
                if(!isTag) {
                    p.innerHTML = buffer;
                    await sleep(speed + Math.random() * 10);
                }
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
            }
            return p;
        }

        async function addCursor() {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            consoleDiv.appendChild(cursor);
            return cursor;
        }

        async function bootSequence() {
            const cursor = await addCursor();
            
            await typeLine("> SYSTEM BOOT SEQUENCE...", 15);
            await sleep(100);
            await typeLine("> LOADING KERNEL... [OK]", 10);
            await sleep(100);
            await typeLine("> MOUNTING HEART PARTITION...", 10);
            await sleep(300);
            await typeLine("> SCANNING FOR AFFECTION...", 10);
            
            // Simulating a scan
            const p = document.createElement('div');
            p.className = "text-green-700 text-xs break-all";
            consoleDiv.appendChild(p);
            let scanChars = "X01";
            for(let j=0; j<4; j++) {
                let chunk = "";
                for(let i=0; i<40; i++) chunk += scanChars.charAt(Math.floor(Math.random()*3));
                p.innerHTML += chunk + " ";
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                await sleep(50);
            }
            
            await sleep(300);
            await typeLine("> TARGET IDENTIFIED.", 20, "text-green-400 font-bold mb-4");
            
            cursor.remove();
            
            // Spacer
            const spacer = document.createElement('div');
            spacer.style.height = "20px";
            consoleDiv.appendChild(spacer);
            
            const newCursor = await addCursor();
            await mainSequence(newCursor);
        }

        async function mainSequence(cursor) {
            cursor.remove();
            
            await typeLine("User Detected.", 40);
            await sleep(300);
            await typeLine("Analyzing relationship parameters...", 20);
            await sleep(600);
            await typeLine("Result: COMPATIBILITY 100%", 30, "text-green-400");
            await sleep(600);
            await typeLine("Critical Request Pending.", 40);
            await sleep(500);
            
            await typeLine("root@heart:~# ./ask_valentine.sh", 20, "text-white mt-4 mb-4");
            await sleep(500);
            
            showInteraction();
        }

        function showInteraction() {
            const wrapper = document.createElement('div');
            wrapper.className = "fade-in flex flex-col items-center w-full";
            wrapper.id = "action-area";
            
            // Question
            const q = document.createElement('div');
            q.className = "text-2xl md:text-3xl text-center text-white mb-8 font-bold tracking-widest";
            q.style.textShadow = "0 0 10px rgba(255,255,255,0.5)";
            q.innerText = "WILL YOU BE MY VALENTINE?";
            wrapper.appendChild(q);

            // Buttons Container
            const btnContainer = document.createElement('div');
            btnContainer.className = "btn-container";
            
            // YES Button
            const btnYes = document.createElement('button');
            btnYes.innerText = "[ Y ] ACCEPT";
            btnYes.className = "btn-term";
            btnYes.onclick = successSequence;
            
            // NO Button (Glitched)
            const btnNo = document.createElement('button');
            btnNo.innerText = "[ N ] DENY";
            btnNo.className = "btn-term btn-glitch";
            btnNo.id = "btn-no";
            
            // Glitch Logic
            const glitchChars = "!@#$%^&*()<>?{}[]";
            
            const triggerGlitch = () => {
                let interval = setInterval(() => {
                    let scrambled = "";
                    for(let i=0; i<8; i++) {
                        scrambled += glitchChars.charAt(Math.floor(Math.random() * glitchChars.length));
                    }
                    btnNo.innerText = scrambled;
                }, 50);

                const errorLine = document.createElement('div');
                errorLine.className = "text-red-600 text-xs font-mono";
                errorLine.innerText = `> ERR: HEART_EXCEPTION (NO_OPTION_FOUND)`;
                consoleDiv.appendChild(errorLine);
                consoleDiv.scrollTop = consoleDiv.scrollHeight;

                setTimeout(() => {
                    clearInterval(interval);
                    btnNo.innerText = "ERROR";
                }, 300);
            };

            btnNo.addEventListener('mouseover', triggerGlitch);
            btnNo.addEventListener('click', triggerGlitch);
            btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); triggerGlitch(); });

            btnContainer.appendChild(btnYes);
            btnContainer.appendChild(btnNo);
            wrapper.appendChild(btnContainer);
            
            consoleDiv.appendChild(wrapper);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        async function successSequence() {
            document.getElementById('action-area').remove();
            
            await typeLine(">>> INPUT ACCEPTED.", 20, "text-green-500 font-bold text-xl mt-4");
            await sleep(300);
            await typeLine("Initializing love protocol...", 20);
            
            // Progress bar
            const barContainer = document.createElement('div');
            barContainer.className = "w-full border border-green-500 h-6 mt-2 mb-4 relative bg-gray-900";
            const fill = document.createElement('div');
            fill.className = "h-full bg-green-500 shadow-[0_0_10px_#00ff41]";
            fill.style.width = "0%";
            barContainer.appendChild(fill);
            consoleDiv.appendChild(barContainer);

            for(let i=0; i<=100; i+=2) {
                fill.style.width = i + "%";
                await sleep(20);
            }
            
            await sleep(300);
            consoleDiv.innerHTML = ""; 
            
            // IMAGE REPLACEMENT for robustness
            const heartImg = document.createElement('img');
            // Using a data URI fallback or external pixel heart URL
            // If you have image_5afc00.png in the same folder, this will work. 
            // Otherwise it falls back to a safe public pixel heart GIF.
            heartImg.src = "image_5afc00.png";
            heartImg.onerror = function() {
                this.src = "https://media.tenor.com/bCKpTc_V440AAAAi/pixel-heart.gif";
            };
            heartImg.className = "heart-img fade-in";
            consoleDiv.appendChild(heartImg);
            
            const finalMsg = document.createElement('div');
            finalMsg.className = "text-center text-xl md:text-3xl text-white mt-4 fade-in font-bold";
            finalMsg.innerHTML = "STATUS: <span class='text-pink-500'>LOCKED_IN_LOVE</span>";
            consoleDiv.appendChild(finalMsg);
            
            const subMsg = document.createElement('div');
            subMsg.className = "text-center text-sm text-gray-400 mt-6 fade-in";
            subMsg.innerHTML = "Session does not expire.";
            consoleDiv.appendChild(subMsg);
        }

        // Start
        window.onload = bootSequence;

    </script>
</body>
</html>
