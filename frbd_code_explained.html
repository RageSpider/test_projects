<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Stack Inspector: Frame of Revolution</title>
    
    <!-- External Fonts & Icons -->
    <link href="https://fonts.cdnfonts.com/css/folks" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0d1117; 
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --keyword: #ff7b72;
            --string: #a5d6ff;
            --tag: #7ee787;
            --attr: #79c0ff;
            --comment: #8b949e;
            --font-code: 'Fira Code', monospace;
            --font-body: 'Folks-Light', sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            background: var(--panel-bg);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; color: var(--text-color); }
        
        .mode-toggles { display: flex; gap: 5px; background: #0d1117; padding: 3px; border-radius: 6px; border: 1px solid var(--border-color); }
        .mode-toggle { 
            background: transparent; border: none; color: var(--comment); 
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-family: var(--font-code);
        }
        .mode-toggle:hover { color: var(--text-color); }
        .mode-toggle.active { background: var(--panel-bg); color: var(--accent-color); font-weight: bold; }

        .run-btn {
            background: #238636; color: white; border: 1px solid rgba(240,246,252,0.1);
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }
        .run-btn:hover { background: #2ea043; }

        /* --- Main Layout --- */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left: Code Editor */
        .editor-pane {
            flex: 1;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #0d1117;
            overflow-y: auto;
            position: relative;
        }

        .code-textarea {
            flex: 1;
            background: transparent;
            color: transparent; /* Text is transparent to show highlighting behind, but caret is visible */
            caret-color: var(--text-color);
            border: none;
            padding: 20px;
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.6;
            resize: none;
            outline: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            white-space: pre;
            overflow: auto;
        }

        .code-highlight-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px;
            font-family: var(--font-code);
            font-size: 13px;
            line-height: 1.6;
            white-space: pre;
            pointer-events: none;
            z-index: 1;
            color: var(--text-color);
            overflow: hidden; /* Scrolled by syncing with textarea */
        }

        /* Right: Live Preview */
        .preview-pane {
            flex: 1;
            background: #111;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .console-log {
            height: 150px;
            background: #0d1117;
            border-top: 1px solid var(--border-color);
            padding: 10px;
            font-family: var(--font-code);
            font-size: 12px;
            overflow-y: auto;
            display: none; /* Toggled by JS logic */
        }
        
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #21262d; padding-bottom: 2px; }
        .log-info { color: var(--string); }
        .log-error { color: #ff7b72; }
        .log-success { color: #7ee787; }

    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-layer-group"></i> Full Stack Inspector</h1>
        <div class="mode-toggles">
            <button class="mode-toggle active" onclick="switchTab('html')" data-tab="html">HTML (Structure)</button>
            <button class="mode-toggle" onclick="switchTab('css')" data-tab="css">CSS (Style)</button>
            <button class="mode-toggle" onclick="switchTab('js')" data-tab="js">JS (Logic)</button>
        </div>
        <button class="run-btn" onclick="runCode()"><i class="fas fa-play"></i> Run Updates</button>
    </header>

    <div class="workspace">
        
        <!-- LEFT: CODE EDITOR -->
        <div class="editor-pane">
            <!-- We stack a real textarea for editing over a div for syntax highlighting (simplified for this demo) -->
            <pre class="code-highlight-layer" id="highlight-layer"></pre>
            <textarea class="code-textarea" id="code-editor" spellcheck="false" oninput="syncScroll(); updateHighlight();" onscroll="syncScroll()"></textarea>
        </div>

        <!-- RIGHT: PREVIEW PANE -->
        <div class="preview-pane">
            <iframe id="preview-frame"></iframe>
            <div class="console-log" id="console-log">
                <div style="color: #8b949e; font-style: italic;">// System Logs & Logic Steps will appear here...</div>
            </div>
        </div>
    </div>

            js: `// LOGIC (JS)
// This mimics your 'main.js' structure exactly.
// We use a fake 'Supabase' object to simulate the backend.

// 1. Mock Supabase Client (So it works in this browser)
const supabase = {
    from: (table) => ({
        insert: async (data) => {
            log(\`📡 Supabase: Inserting into table '\${table}'...\`);
            await new Promise(r => setTimeout(r, 1500)); // Fake network delay
            log(\`✅ Supabase: Insert Successful!\`);
            return { error: null }; 
        }
    })
};

// 2. Main Logic (Runs when DOM is ready)
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    if(!form) return;

    // Create message box dynamically
    const messageBox = document.createElement('p');
    messageBox.className = 'form-message';
    messageBox.style.display = 'none';
    form.parentNode.insertBefore(messageBox, form.nextSibling);

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        log("⚡ Event: Form Submitted. Preventing default refresh.");

        const btn = form.querySelector('button');
        const originalText = btn.innerText;
        
        // Start Loading
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        messageBox.style.display = 'none';

        // Gather Data
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        log("📦 Data Collected: " + JSON.stringify(data));

        // Validation Logic (From your main.js)
        const contactNumber = data['Contact Number (WhatsApp)'];
        
        // Regex: Must start with 01 and have 9 digits after
        if (!contactNumber.match(/^01\\d{9}$/)) {
            showMessage("❌ Error: Phone must be 01xxxxxxxxx (11 digits)", "error");
            resetBtn();
            return;
        }

        // Logic Switch (mimicking your table selection)
        let tableName = 'mobile_photography'; // default for this form
        
        // Send to Fake Supabase
        const { error } = await supabase.from(tableName).insert(data);
        
        if (!error) {
            showMessage("🎉 Registration Successful!", "success");
            form.reset();
        } else {
            showMessage("Error: " + error.message, "error");
        }
        
        resetBtn();

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = 'form-message ' + type;
            messageBox.style.display = 'block';
            log(msg);
        }

        function resetBtn() {
            btn.disabled = false;
            btn.innerText = originalText;
        }
    });
});

// Helper to print to the visual console below
function log(msg) {
    window.parent.postMessage({ type: 'log', message: msg }, '*');
}`
        };

        // --- 2. EDITOR LOGIC ---
        let currentTab = 'html';
        const editor = document.getElementById('code-editor');
        const highlighter = document.getElementById('highlight-layer');
        const consoleLog = document.getElementById('console-log');

        function switchTab(tab) {
            currentTab = tab;
            // Update buttons
            document.querySelectorAll('.mode-toggle').forEach(b => b.classList.remove('active'));
            
            // Activate the correct button safely (fixing the previous error)
            const activeBtn = document.querySelector(`.mode-toggle[data-tab="${tab}"]`);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
            
            // Set content
            editor.value = fileContent[tab];
            updateHighlight();
            
            // Toggle Console visibility (Only show for JS)
            if (tab === 'js') {
                consoleLog.style.display = 'block';
            } else {
                consoleLog.style.display = 'none';
            }
        }

        function updateHighlight() {
            // Very basic syntax highlighting for demo purposes
            let code = editor.value;
            code = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Highlight comments (simple regex)
            code = code.replace(/(\/\/.*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)/g, '<span style="color: #8b949e;">$1</span>');
            
            highlighter.innerHTML = code; 
        }

        function syncScroll() {
            highlighter.scrollTop = editor.scrollTop;
            highlighter.scrollLeft = editor.scrollLeft;
        }

        function saveCurrentTab() {
            fileContent[currentTab] = editor.value;
        }

        // --- 3. RUNNER LOGIC ---
        function runCode() {
            saveCurrentTab(); // Save whatever is currently being edited
            
            const frame = document.getElementById('preview-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;

            // Clear Console
            consoleLog.innerHTML = '<div style="color: #8b949e; font-style: italic;">// Console cleared. Ready for input...</div>';

            doc.open();
            
            // Inject CSS
            let html = fileContent.html;
            // We find the <style> tag or head and inject our CSS
            if (html.includes('</head>')) {
                html = html.replace('</head>', `<style>${fileContent.css}</style></head>`);
            } else {
                html += `<style>${fileContent.css}</style>`;
            }

            // Inject JS
            // We wrap JS in a script tag and append to body
            html += `<script>${fileContent.js}<\/script>`;

            doc.write(html);
            doc.close();
        }

        // --- 4. MESSAGE LISTENER (For Console Logs) ---
        window.addEventListener('message', (event) => {
            if (event.data.type === 'log') {
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                
                if (event.data.message.includes('Error') || event.data.message.includes('❌')) {
                    entry.classList.add('log-error');
                } else if (event.data.message.includes('Success') || event.data.message.includes('🎉') || event.data.message.includes('✅')) {
                    entry.classList.add('log-success');
                } else {
                    entry.classList.add('log-info');
                }
                
                entry.textContent = `> ${event.data.message}`;
                consoleLog.appendChild(entry);
                consoleLog.scrollTop = consoleLog.scrollHeight;
            }
        });

        // Initialize
        switchTab('html');
        // Initial run
        setTimeout(runCode, 100);

    </script>
</body>
